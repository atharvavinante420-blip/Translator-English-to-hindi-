<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
    <center><h1 id ="heading">welcome to translator (English to hindi)</h1></center>
    </nav>

    <br>
    <br>

    <div id="input_box">
        <h1>Enter the text in English </h1>
        <textarea name="text" id="text_to_translate" placeholder="Enter the text in English"></textarea>
    </div>

    <div>
        <center><button id="btn">translate</button></center> 
    </div>

    <hr>

    <div id="output_box">
        <h1><center>Translated text in hindi</center></h1>
        <p name="text" id="translated_text" placeholder="translate_the_text">
            
        </p>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
